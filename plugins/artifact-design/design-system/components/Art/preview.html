<!-- @dsCard group="Drawings" height=768 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>body{padding:26px 30px 30px;margin:0}</style></head>
<body>
<div class="sk-stack" style="--gap:26px">
<div class="sk-row" style="--gap:22px;align-items:flex-end">
  <div class="sk-stack" style="--gap:8px;justify-items:center"><div class="sk-art" data-sk-draw="house" style="--size:170px" aria-label="A house"></div><span class="sk-caption">Clay</span></div>
  <div class="sk-stack" style="--gap:8px;justify-items:center"><div class="sk-art" data-tone="oat" data-sk-draw="blossom" style="--size:170px" aria-label="A branch of blossom"></div><span class="sk-caption">Oat</span></div>
  <div class="sk-stack" style="--gap:8px;justify-items:center"><div class="sk-art" data-tone="sage" data-sk-draw="mountain" style="--size:170px" aria-label="A mountain"></div><span class="sk-caption">Sage</span></div>
  <div class="sk-stack" style="--gap:8px;justify-items:center"><div class="sk-art" data-tone="ink" data-sk-draw="moon" style="--size:170px" aria-label="A moon"></div><span class="sk-caption">Ink, in chalk</span></div>
  <div class="sk-stack" style="--gap:8px;justify-items:center"><div class="sk-art" data-size="s" data-tone="sage" data-sk-draw="cup" aria-label="A cup"></div><span class="sk-caption">Small</span></div>
</div>
<div class="sk-grid" style="--min:200px">
  <article class="sk-card"><div class="sk-art" data-sk-shape="panel" data-tone="sage" data-sk-draw="mountain" aria-hidden="true"></div><div class="sk-label">Sun 28</div><h3>Fushimi Inari</h3><p class="sk-small">The gates at 7 am, then sake in Fushimi.</p></article>
  <article class="sk-card"><div class="sk-art" data-sk-shape="panel" data-tone="oat" data-sk-draw="blossom" aria-hidden="true"></div><div class="sk-label">Mon 29</div><h3>Higashiyama on foot</h3><p class="sk-small">Kiyomizu-dera, then the Philosopher's Path.</p></article>
  <article class="sk-card"><div class="sk-art" data-sk-shape="panel" data-sk-draw="train" aria-hidden="true"></div><div class="sk-label">Tue 30</div><h3>Arashiyama</h3><p class="sk-small">Bamboo, the river, and a weekday crowd.</p></article>
</div></div>
</body>
</html>
