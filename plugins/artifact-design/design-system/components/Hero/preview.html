<!-- @dsCard group="Drawings" height=505 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>body{padding:26px 30px 30px;margin:0}</style></head>
<body>
<div class="sk-grid" style="--min:200px;--gap:30px;align-items:end">
  <div class="sk-stack" style="--gap:10px;justify-items:center"><div class="sk-hero-art" data-sk-draw="board" data-sk-boil aria-label="A clipboard" style="width:200px"></div><span class="sk-caption">Blob, boiling</span></div>
  <div class="sk-stack" style="--gap:10px;justify-items:center"><div class="sk-hero-art" data-sk-shape="tile" data-sk-draw="box" aria-label="A parcel" style="width:180px"></div><span class="sk-caption">Tile, for an object</span></div>
  <div class="sk-stack" style="--gap:10px;justify-items:center"><div class="sk-hero-art" data-sk-draw="cake glass" data-sk-scene="still" aria-label="A birthday cake and a glass of wine" style="width:220px"></div><span class="sk-caption">Scene, still</span></div>
  <div class="sk-stack" style="--gap:10px;justify-items:center"><div class="sk-hero-art" data-sk-draw="book pencil bulb" data-sk-scene="orbit" aria-label="An open book, a pencil and a light bulb" style="width:220px"></div><span class="sk-caption">Scene, orbit</span></div>
  <div class="sk-stack" style="--gap:10px;justify-items:center"><div class="sk-hero-art" data-sk-shape="none" data-sk-draw="cup" aria-label="A cup of coffee" style="width:170px"></div><span class="sk-caption">No ground</span></div>
</div>
</body>
</html>
