<body>
<ol class="sk-steps" data-row>
<li><h4>Add the marketplace</h4><p>Once per machine.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>claude plugin marketplace add aaron-pak/pak-plugins</code></pre></li>
<li><h4>Install the plugin</h4><p>It turns on next session.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>claude plugin install session-band</code></pre></li>
<li><h4>Pick a style</h4><p>Change it any time.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>/band style tide</code></pre></li></ol>
</body>
</html>
