<ol class="sk-steps" data-row>
<li><h4>Add the marketplace</h4><p>Once per machine.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>claude plugin marketplace add aaron-pak/pak-plugins</code></pre></li>
<li><h4>Install the plugin</h4><p>It turns on next session.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>claude plugin install auto-memory</code></pre></li>
<li><h4>Keep notes fresh</h4><p>Consolidate past sessions any time.</p><pre class="sk-code" data-lang="sh" data-sk-nonum><code>/auto-memory:dream</code></pre></li></ol>
</body>
