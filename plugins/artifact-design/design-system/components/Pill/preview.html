<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>body{padding:26px 30px 30px;margin:0}</style></head>
<body>
<div class="sk-stack" style="--gap:16px"><div class="sk-row" style="--gap:8px"><span class="sk-pill" data-tone="good" data-dot>On track</span><span class="sk-pill" data-tone="warn" data-dot>At risk</span><span class="sk-pill" data-tone="bad" data-dot>Failed</span><span class="sk-pill" data-tone="clay">New</span><span class="sk-pill">Draft</span><span class="sk-pill" data-tone="line">Dana</span><span class="sk-pill" data-tone="ink">v2</span></div>
<div class="sk-row" style="--gap:8px"><button class="sk-chip" aria-pressed="true">Espresso <span class="sk-count">12</span></button><button class="sk-chip" aria-pressed="false">Pastry <span class="sk-count">5</span></button><button class="sk-chip" aria-pressed="false">Seasonal</button></div>
<div class="sk-row" style="--gap:12px"><span class="sk-live">Moving</span><span class="sk-caption">a live tag for something happening now</span></div></div>
</body>
</html>
