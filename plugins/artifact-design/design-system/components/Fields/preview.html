<!-- @dsCard group="Controls" height=403 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>body{padding:26px 30px 30px;margin:0}</style></head>
<body>
<div class="sk-grid" style="--min:240px;--gap:22px 24px;max-width:720px">
<div class="sk-field"><label for="f1">Home price</label><div class="sk-affix"><span>$</span><input class="sk-input" id="f1" inputmode="numeric" value="520,000"></div></div>
<div class="sk-field"><label for="f2">Interest rate</label><div class="sk-affix"><input class="sk-input" id="f2" value="6.4"><span>%</span></div><div class="sk-help">Today's 30-year average is about 6.4%.</div></div>
<div class="sk-field"><label for="f3">Loan type</label><div class="sk-select"><select id="f3"><option>Fixed rate</option><option>Adjustable</option></select></div></div>
<div class="sk-field"><label for="f4">Delivery note</label><textarea class="sk-input" id="f4" rows="2">With the doorman, please.</textarea></div>
<div class="sk-field" style="grid-column:1/-1"><label for="f5">Down payment <output for="f5">10%</output></label><input class="sk-range" type="range" id="f5" min="3" max="40" value="10" data-sk-format='{"suffix":"%"}'><div class="sk-range-ends"><span>3%</span><span>40%</span></div></div>
</div>
</body>
</html>
